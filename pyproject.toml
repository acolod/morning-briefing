[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-briefing"
version = "0.1.0"
description = "HTML-first daily AI and developer briefing pipeline"
readme = "IMPLEMENTATION_SPEC.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["briefing"]

[tool.setuptools.data-files]
"templates" = ["templates/daily-brief.html"]
